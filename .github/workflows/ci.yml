name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tier 1 — Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  lint:
    name: Lint & conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kotlin lint
        run: ./gradlew ktlintCheck detekt
      - name: WebUI lint
        working-directory: webui
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

  schema-check:
    name: Schema codegen freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate and diff
        run: |
          ./gradlew :tools:codegen:run
          cd webui && npm ci && npm run codegen
          git diff --exit-code -- libs/ webui/src/generated

  avd-ui:
    name: Tier 2 — AVD UI (Roborazzi + Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD image cache
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :launcher:app:connectedDebugAndroidTest :companion:app:connectedDebugAndroidTest

  webui:
    name: Tier 2 — WebUI (vitest + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & test
        run: |
          npm ci
          npm run test
          npx playwright install --with-deps chromium
          npm run e2e
