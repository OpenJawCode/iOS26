name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tier 1 — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;36.0.0" > /dev/null 2>&1
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  quality:
    name: Static analysis (ktlint + detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;36.0.0" > /dev/null 2>&1
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --no-daemon

  architecture:
    name: Architecture gate + docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;36.0.0" > /dev/null 2>&1
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate architecture
        run: ./gradlew architectureValidate --no-daemon
      - name: Regenerate MODULES.md and diff
        run: |
          ./gradlew generateModulesDoc --no-daemon
          git diff --exit-code -- MODULES.md

  build:
    name: Assemble (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;36.0.0" > /dev/null 2>&1
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble all variants
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            launcher/app/build/outputs/apk/debug/*.apk
            launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
