# Version catalog — pinned per docs/phase0/research-log.md R1/R2 and Phase 1 bootstrap.
# NEVER add inline versions in module build files.

[versions]
# Toolchain (R1)
agp = "9.3.1"
kotlin = "2.4.10"            # serialization compiler plugin; built-in Kotlin comes from AGP
compileSdk = "33"
minSdk = "33"
targetSdk = "33"
jdk = "21"
buildTools = "36.0.0"
gradle = "9.6.1"             # wrapper

# Kotlinx (verified 2026-08-02 against Maven Central)
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"

# Testing (Tier 1)
junit4 = "4.13.2"

# Schema
networknt = "3.0.6"

# Static analysis
detekt = "1.23.8"
ktlint = "12.1.2"

# Root ecosystem (Phase 3+; recorded for provenance)
magisk = "30.7"
lsposed = "2.1.0"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
networknt = { group = "com.networknt", name = "json-schema-validator", version.ref = "networknt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
